name: Frontend kontrolleri
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  kontrol:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kampus-etkinlik/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: kampus-etkinlik/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
